# Dhemax (plataforma de los cargadores): las cargas vistas desde cada cargador y el estado en vivo de cada
# manguera (dhemax/hoy). Todo el día: cada corrida lee cada 60 s durante ~55 min y deja pedida la siguiente.
# Respaldo: el vigilante del SGDC (sgdc.yml) lo lanza si no está corriendo.
# Secretos: FIREBASE_SERVICE_ACCOUNT, DHEMAX_USUARIO y DHEMAX_CLAVE.
# El repo es público: el log muestra pistolas, %, kWh y horas (Dhemax no trae patentes). Nunca el token.
name: Dhemax (cargadores)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Una sola corriendo a la vez; la siguiente espera en cola.
concurrency:
  group: dhemax
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # para encadenar la corrida siguiente (paso final)

jobs:
  sync:
    runs-on: ubuntu-latest
    # 330: el paso principal tiene su tope de 60 min; el resto es para los reintentos al encadenar.
    timeout-minutes: 330
    steps:
      - name: ¿Están los secretos?
        id: clave
        env:
          HAY_CLAVE: ${{ secrets.DHEMAX_USUARIO != '' && secrets.DHEMAX_CLAVE != '' }}
        run: |
          if [ "$HAY_CLAVE" = "true" ]; then
            echo "si=1" >> "$GITHUB_OUTPUT"
          else
            echo "Faltan los secretos DHEMAX_USUARIO / DHEMAX_CLAVE: no se lee ni se encadena."
          fi
      - uses: actions/checkout@v5
        if: steps.clave.outputs.si == '1'
      - uses: actions/setup-node@v5
        if: steps.clave.outputs.si == '1'
        with:
          node-version: 22
      - name: Instalar
        if: steps.clave.outputs.si == '1'
        working-directory: tools
        run: npm install --no-audit --no-fund
      - name: Leer Dhemax cada 60 s (~55 min)
        if: steps.clave.outputs.si == '1'
        working-directory: tools
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DHEMAX_USUARIO: ${{ secrets.DHEMAX_USUARIO }}
          DHEMAX_CLAVE: ${{ secrets.DHEMAX_CLAVE }}
        timeout-minutes: 60
        run: node dhemax_sync.mjs --loop --cada 60
      # El cron de GitHub se atrasa o se salta pasadas: la corrida deja pedida la siguiente (queda en cola por
      # la concurrencia). Solo si esta salió bien, para no encadenar fallas.
      - name: Encadenar la siguiente corrida
        if: success() && steps.clave.outputs.si == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        # Si GitHub falla, reintenta a los 5, 10 y 15 min y luego cada 30 (ver tools/encadenar.sh).
        timeout-minutes: 270
        run: bash tools/encadenar.sh dhemax.yml siempre
